name: reproduce

# Re-runs every row of the README's Results table on a clean Linux runner (CPU only),
# through real ffmpeg libopus and libopencore-amrnb. The full log is in the job summary.
on:
  push:
    branches: [main]
    paths: ["core/**", "app/static/cover.wav", "experiments/test_prosody_modem.py", "reproduce.sh", "requirements.txt", ".github/workflows/reproduce.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System codecs
        # Opus rows use Ubuntu's ffmpeg (libopus 1.4). Ubuntu's ffmpeg has no AMR-NB encoder, so the
        # cellular rows use the johnvansickle.com static build (libopencore-amrnb, libopus 1.3.1).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg codec2 libopus0
          ffmpeg -hide_banner -encoders | grep -q libopus
          mkdir -p "$RUNNER_TEMP/ffmpeg-amr"
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/ffmpeg-amr" --strip-components=1
          "$RUNNER_TEMP/ffmpeg-amr/ffmpeg" -hide_banner -version | head -1
          "$RUNNER_TEMP/ffmpeg-amr/ffmpeg" -hide_banner -encoders | grep -q libopencore_amrnb
          echo "AMR_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-amr" >> "$GITHUB_ENV"
      - name: Python deps (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install opuslib==3.0.1 "setuptools<80"
          pip install --no-build-isolation pyworld==0.3.5
      - name: Reproduce
        run: |
          set -o pipefail
          PYTHON=python ./reproduce.sh 2>&1 | tee reproduce.log
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat reproduce.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
